<script type="module">
    // 1. Use the CDN URLs so the browser can download the Firebase code
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, collection, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // 2. Your specific configuration
    const firebaseConfig = {
        apiKey: "AIzaSyAXlmF92ViWxn0lrQ1o8p3s4UlDHBh7CCg",
        authDomain: "web-app-7f330.firebaseapp.com",
        projectId: "web-app-7f330",
        storageBucket: "web-app-7f330.firebasestorage.app",
        messagingSenderId: "991761230541",
        appId: "1:991761230541:web:4063b0ab78e03a72075784"
    };

    // 3. Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // 4. Attach the login function to the "window" so the button can see it
    window.adminLogin = async () => {
        const email = document.getElementById('adminEmail').value;
        const pass = document.getElementById('adminPass').value;

        try {
            await signInWithEmailAndPassword(auth, email, pass);
            console.log("Logged in!");
        } catch (error) {
            alert("Login Error: " + error.message);
        }
    };

    // 5. Auth Listener to show/hide the dashboard
    onAuthStateChanged(auth, (user) => {
        const loginSec = document.getElementById('loginSection');
        const dashSec = document.getElementById('adminDashboard');
        
        if (user) {
            loginSec.classList.add('hidden');
            dashSec.classList.remove('hidden');
            // startAnalytics(); // Call your chart function here
        } else {
            loginSec.classList.remove('hidden');
            dashSec.classList.add('hidden');
        }
    });
</script>
