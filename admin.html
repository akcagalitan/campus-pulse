<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>USC Admin | Private Inbox</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-6">

    <div id="loginSection" class="max-w-md mx-auto bg-slate-800 p-10 rounded-[2rem] mt-20 shadow-2xl">
        <h2 class="text-2xl font-black mb-6 text-center text-indigo-400">ADMIN LOGIN</h2>
        <input type="email" id="adminEmail" placeholder="Email" class="w-full p-4 bg-slate-700 border-none rounded-2xl mb-4 text-white">
        <input type="password" id="adminPass" placeholder="Password" class="w-full p-4 bg-slate-700 border-none rounded-2xl mb-6 text-white">
        <button onclick="adminLogin()" class="w-full bg-indigo-500 text-white py-4 rounded-2xl font-black hover:bg-indigo-600 transition">ENTER VAULT</button>
    </div>

    <div id="adminDashboard" class="hidden max-w-6xl mx-auto">
        <div class="flex justify-between items-center mb-12">
            <h1 class="text-4xl font-black italic text-indigo-400">SERIOUS INBOX</h1>
            <button onclick="logout()" class="text-xs font-bold opacity-50 hover:opacity-100">LOGOUT</button>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-10">
            <div class="lg:col-span-1 space-y-6">
                <div class="bg-slate-800 p-8 rounded-[2rem]">
                    <h3 class="text-xs font-bold text-slate-500 mb-4 uppercase">Resolution Progress</h3>
                    <canvas id="resChart"></canvas>
                </div>
                <div class="bg-indigo-600 p-8 rounded-[2rem]">
                    <p class="text-xs font-bold opacity-60 uppercase mb-2">Active Concerns</p>
                    <h2 id="totalCount" class="text-6xl font-black">0</h2>
                </div>
            </div>

            <div class="lg:col-span-2">
                <div id="seriousWall" class="space-y-4">
                    </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, query, orderBy, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAXlmF92ViWxn0lrQ1o8p3s4UlDHBh7CCg",
            authDomain: "web-app-7f330.firebaseapp.com",
            projectId: "web-app-7f330",
            storageBucket: "web-app-7f330.firebasestorage.app",
            messagingSenderId: "991761230541",
            appId: "1:991761230541:web:4063b0ab78e03a72075784"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        let myChart;

        window.adminLogin = () => {
            const email = document.getElementById('adminEmail').value;
            const pass = document.getElementById('adminPass').value;
            signInWithEmailAndPassword(auth, email, pass).catch(err => alert(err.message));
        };

        window.logout = () => signOut(auth);

        window.toggleResolve = async (id, status) => {
            await updateDoc(doc(db, "serious_concerns", id), { status: status === 'pending' ? 'done' : 'pending' });
        };

        window.deleteMsg = async (id) => { if(confirm("Delete?")) await deleteDoc(doc(db, "serious_concerns", id)); };

        onAuthStateChanged(auth, (user) => {
            document.getElementById('loginSection').classList.toggle('hidden', !!user);
            document.getElementById('adminDashboard').classList.toggle('hidden', !user);
            if(user) loadSeriousData();
        });

        function loadSeriousData() {
            const q = query(collection(db, "serious_concerns"), orderBy("createdAt", "desc"));
            onSnapshot(q, (snaps) => {
                const wall = document.getElementById('seriousWall');
                let done = 0; let pending = 0;
                wall.innerHTML = "";
                
                snaps.forEach(d => {
                    const data = d.data();
                    const isDone = data.status === 'done';
                    isDone ? done++ : pending++;

                    wall.innerHTML += `
                        <div class="p-6 rounded-3xl ${isDone ? 'bg-slate-800/50 opacity-50' : 'bg-slate-800'} border border-slate-700 flex justify-between items-center">
                            <div>
                                <p class="text-[10px] font-bold text-indigo-400 mb-1 uppercase">${data.from} → ${data.to}</p>
                                <p class="font-bold text-lg">${data.text}</p>
                            </div>
                            <div class="flex gap-2">
                                <button onclick="toggleResolve('${d.id}', '${data.status}')" class="px-4 py-2 rounded-xl text-xs font-bold ${isDone ? 'bg-green-500 text-white' : 'bg-indigo-500 text-white'}">
                                    ${isDone ? 'RESOLVED' : 'PENDING'}
                                </button>
                                <button onclick="deleteMsg('${d.id}')" class="text-slate-500">✕</button>
                            </div>
                        </div>`;
                });
                document.getElementById('totalCount').innerText = pending;
                updateChart(done, pending);
            });
        }

        function updateChart(done, pending) {
            const ctx = document.getElementById('resChart').getContext('2d');
            if(myChart) myChart.destroy();
            myChart = new Chart(ctx, {
                type: 'pie',
                data: {
                    labels: ['Resolved', 'Pending'],
                    datasets: [{ data: [done, pending], backgroundColor: ['#10b981', '#6366f1'], borderWidth: 0 }]
                },
                options: { plugins: { legend: { display: false } } }
            });
        }
    </script>
</body>
</html>
