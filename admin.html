<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard | USC Data</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-slate-100 min-h-screen">

    <div id="loginSection" class="max-w-md mx-auto bg-white p-10 rounded-3xl shadow-2xl mt-20">
        <h2 class="text-2xl font-black mb-6 text-center text-slate-800 tracking-tight uppercase">Admin Verification</h2>
        <input type="email" id="adminEmail" placeholder="Email" class="w-full p-4 border-2 border-slate-100 rounded-2xl mb-4 outline-none focus:border-indigo-400">
        <input type="password" id="adminPass" placeholder="Password" class="w-full p-4 border-2 border-slate-100 rounded-2xl mb-6 outline-none focus:border-indigo-400">
        <button onclick="adminLogin()" class="w-full bg-slate-900 text-white py-4 rounded-2xl font-black tracking-widest hover:bg-indigo-600 transition">LOGIN</button>
    </div>

    <div id="adminDashboard" class="hidden p-6 lg:p-12">
        <div class="flex flex-col lg:flex-row justify-between items-center mb-12 gap-6">
            <div>
                <h1 class="text-5xl font-black text-slate-900">USC COMMAND</h1>
                <p class="text-slate-500 font-bold uppercase text-xs tracking-widest">Student Voice Analytics Dashboard</p>
            </div>
            <button onclick="logout()" class="bg-white border-2 border-slate-200 px-8 py-3 rounded-2xl font-bold hover:bg-red-50 hover:border-red-200 hover:text-red-600 transition">Logout</button>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <div class="space-y-6">
                <div class="bg-white p-8 rounded-[2rem] shadow-sm">
                    <h3 class="text-xs font-black text-slate-400 uppercase tracking-widest mb-6">College Distribution</h3>
                    <canvas id="collegeChart"></canvas>
                </div>
                <div class="bg-indigo-600 p-8 rounded-[2rem] text-white">
                    <p class="text-xs font-bold text-indigo-200 uppercase mb-2">Total Submissions</p>
                    <h2 id="totalCount" class="text-6xl font-black italic">0</h2>
                </div>
            </div>

            <div class="lg:col-span-2 space-y-6">
                <div class="bg-white rounded-[2.5rem] shadow-sm border border-slate-200 overflow-hidden">
                    <div class="bg-slate-50 px-8 py-6 border-b border-slate-100 flex justify-between items-center">
                        <h2 class="font-black text-slate-700 tracking-tight">ACTIONABLE CONCERNS</h2>
                        <span class="bg-orange-100 text-orange-600 px-3 py-1 rounded-full text-[10px] font-black">NEWEST FIRST</span>
                    </div>
                    <div id="adminWall" class="divide-y divide-slate-100">
                        </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, query, orderBy, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAXlmF92ViWxn0lrQ1o8p3s4UlDHBh7CCg",
            authDomain: "web-app-7f330.firebaseapp.com",
            projectId: "web-app-7f330",
            storageBucket: "web-app-7f330.firebasestorage.app",
            messagingSenderId: "991761230541",
            appId: "1:991761230541:web:4063b0ab78e03a72075784"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        let myChart;

        window.adminLogin = () => {
            const email = document.getElementById('adminEmail').value;
            const pass = document.getElementById('adminPass').value;
            signInWithEmailAndPassword(auth, email, pass).catch(err => alert(err.message));
        };

        window.logout = () => signOut(auth);

        window.toggleStatus = async (id, currentStatus) => {
            const newStatus = currentStatus === 'pending' ? 'addressed' : 'pending';
            await updateDoc(doc(db, "messages", id), { status: newStatus });
        };

        window.deleteMessage = async (id) => {
            if(confirm("Confirm Deletion?")) await deleteDoc(doc(db, "messages", id));
        };

        onAuthStateChanged(auth, (user) => {
            document.getElementById('loginSection').classList.toggle('hidden', !!user);
            document.getElementById('adminDashboard').classList.toggle('hidden', !user);
            if(user) runAdminLogic();
        });

        function runAdminLogic() {
            const q = query(collection(db, "messages"), orderBy("createdAt", "desc"));
            onSnapshot(q, (snapshot) => {
                const wall = document.getElementById('adminWall');
                const stats = { "COT": 0, "COED": 0, "CHM": 0, "Unknown": 0 };
                wall.innerHTML = "";
                
                snapshot.forEach((fbDoc) => {
                    const data = fbDoc.data();
                    const id = fbDoc.id;
                    const from = (data.from || "").toLowerCase();
                    
                    if (from.includes("tech") || from.includes("cot")) stats["COT"]++;
                    else if (from.includes("edu") || from.includes("coed")) stats["COED"]++;
                    else if (from.includes("hosp") || from.includes("chm")) stats["CHM"]++;
                    else stats["Unknown"]++;

                    const isDone = data.status === 'addressed';
                    wall.innerHTML += `
                        <div class="p-8 flex items-center justify-between hover:bg-slate-50 transition-colors">
                            <div class="${isDone ? 'opacity-30' : ''}">
                                <div class="flex gap-2 mb-1">
                                    <span class="text-[9px] font-black px-2 py-1 bg-slate-100 rounded text-slate-500 uppercase">${data.from}</span>
                                    <span class="text-[9px] font-black px-2 py-1 bg-indigo-50 rounded text-indigo-500 uppercase">TO: ${data.to}</span>
                                </div>
                                <p class="text-slate-800 font-bold text-lg">${data.text}</p>
                            </div>
                            <div class="flex items-center gap-4">
                                <button onclick="toggleStatus('${id}', '${data.status}')" class="px-6 py-2 rounded-xl text-xs font-black transition-all ${isDone ? 'bg-green-500 text-white shadow-lg shadow-green-100' : 'bg-slate-100 text-slate-600 hover:bg-orange-100 hover:text-orange-600'}">
                                    ${isDone ? 'COMPLETED' : 'RESOLVE'}
                                </button>
                                <button onclick="deleteMessage('${id}')" class="text-slate-300 hover:text-red-500 transition-colors text-xl">✕</button>
                            </div>
                        </div>`;
                });

                document.getElementById('totalCount').innerText = snapshot.size;
                updateChart(stats);
            });
        }

        function updateChart(stats) {
            const ctx = document.getElementById('collegeChart').getContext('2d');
            if (myChart) myChart.destroy();
            myChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['COT', 'COED', 'CHM', 'Other'],
                    datasets: [{
                        data: [stats.COT, stats.COED, stats.CHM, stats.Unknown],
                        backgroundColor: ['#6366f1', '#f59e0b', '#10b981', '#cbd5e1'],
                        borderWidth: 0
                    }]
                },
                options: { cutout: '80%', plugins: { legend: { display: false } } }
            });
        }
    </script>
</body>
</html>
