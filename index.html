<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Pulse | Wall & Games</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        .note { transition: all 0.3s ease; }
        .note:hover { transform: translateY(-5px) rotate(1deg); }
        .bg-dots { background-color: #f8fafc; background-image: radial-gradient(#cbd5e1 1px, transparent 1px); background-size: 30px 30px; }
        #gameHub { display: none; position: fixed; inset: 0; background: rgba(15, 23, 42, 0.95); z-index: 100; overflow-y: auto; color: white; }
    </style>
</head>
<body class="bg-dots min-h-screen pb-20">

    <div id="gameHub" class="p-6">
        <div class="max-w-2xl mx-auto py-10">
            <div class="flex justify-between items-center mb-10">
                <h2 class="text-4xl font-black">GAME CENTER 🎮</h2>
                <button onclick="toggleGame()" class="bg-white/10 hover:bg-white/20 p-3 rounded-full">✕ Close</button>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="bg-white/10 p-6 rounded-3xl text-center border border-white/10">
                    <p class="text-xs font-bold text-indigo-400 mb-2 uppercase">Campus Clicker</p>
                    <div onclick="earnPoint()" class="text-6xl my-4 cursor-pointer active:scale-90 transition">🎓</div>
                    <p id="scoreDisplay" class="text-2xl font-black">Points: 0</p>
                </div>
                <div class="bg-white/10 p-6 rounded-3xl text-center border border-white/10">
                    <p class="text-xs font-bold text-orange-400 mb-2 uppercase">Math Sprint</p>
                    <p id="mathQuestion" class="text-2xl font-black my-4">5 + 7 = ?</p>
                    <input type="number" id="mathAnswer" class="bg-black/20 w-20 p-2 rounded text-center outline-none border-b-2 border-orange-400">
                    <button onclick="checkMath()" class="block mx-auto mt-4 text-xs font-bold bg-orange-500 px-4 py-2 rounded">SUBMIT</button>
                </div>
            </div>
            
            <div class="mt-6 bg-white/10 p-8 rounded-3xl border border-white/10 text-center">
                <p class="text-xs font-bold text-green-400 mb-2 uppercase">Daily Riddle</p>
                <p class="italic">"I have keys, but no locks. I have a space, but no room. You can enter, but never leave. What am I?"</p>
                <p id="riddleAns" class="mt-4 text-gray-500 text-sm hidden">Answer: A Keyboard</p>
                <button onclick="document.getElementById('riddleAns').classList.toggle('hidden')" class="mt-2 text-xs opacity-50 underline">Show Answer</button>
            </div>
        </div>
    </div>

    <header class="py-12 text-center">
        <h1 class="text-6xl font-black text-indigo-600 mb-2">CAMPUS PULSE</h1>
        <button onclick="toggleGame()" class="bg-indigo-600 text-white px-6 py-2 rounded-full font-black text-sm animate-pulse">PLAY GAMES 🕹️</button>
    </header>

    <section class="max-w-2xl mx-auto px-4 mb-16">
        <div class="bg-white p-8 rounded-[2.5rem] shadow-2xl border-2 border-slate-100">
            <textarea id="message" placeholder="Type your message or serious concern here..." class="w-full p-5 bg-slate-50 rounded-2xl outline-none focus:ring-2 ring-indigo-400 h-28 mb-4 transition"></textarea>
            
            <div class="grid grid-cols-2 gap-4 mb-6">
                <input type="text" id="fromCollege" placeholder="College (e.g. COT)" class="p-3 bg-slate-50 rounded-xl outline-none border-2 border-transparent focus:border-indigo-400">
                <input type="text" id="toWhom" placeholder="To: (e.g. USC)" class="p-3 bg-slate-50 rounded-xl outline-none border-2 border-transparent focus:border-indigo-400">
            </div>

            <div class="flex gap-3">
                <button onclick="postToWall()" class="flex-1 bg-slate-800 text-white py-4 rounded-2xl font-bold hover:bg-slate-900 transition">Post to Wall 📢</button>
                <button onclick="postSerious()" class="flex-1 bg-indigo-600 text-white py-4 rounded-2xl font-bold hover:bg-indigo-700 shadow-lg shadow-indigo-200 transition">Serious Concern 📩</button>
            </div>
        </div>
    </section>

    <main id="wall" class="container mx-auto px-6 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-6">
        </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, query, orderBy, limit, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAXlmF92ViWxn0lrQ1o8p3s4UlDHBh7CCg",
            authDomain: "web-app-7f330.firebaseapp.com",
            projectId: "web-app-7f330",
            storageBucket: "web-app-7f330.firebasestorage.app",
            messagingSenderId: "991761230541",
            appId: "1:991761230541:web:4063b0ab78e03a72075784"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // --- GAMES LOGIC ---
        window.toggleGame = () => {
            const gh = document.getElementById('gameHub');
            gh.style.display = gh.style.display === 'block' ? 'none' : 'block';
        };

        let score = 0;
        window.earnPoint = () => {
            score++;
            document.getElementById('scoreDisplay').innerText = `Points: ${score}`;
            if(score % 20 === 0) confetti({ particleCount: 100 });
        };

        window.checkMath = () => {
            const ans = document.getElementById('mathAnswer').value;
            if(ans == "12") {
                alert("Correct! You're a genius! 🧠");
                confetti();
            } else { alert("Try again!"); }
        };

        // --- FIREBASE LOGIC ---
        // 1. Post to Wall (Public only)
        window.postToWall = async () => {
            const msg = document.getElementById('message').value;
            if(!msg) return;
            await addDoc(collection(db, "public_wall"), {
                text: msg,
                from: document.getElementById('fromCollege').value || "Anon",
                createdAt: serverTimestamp()
            });
            document.getElementById('message').value = "";
            confetti({ origin: { y: 0.9 } });
        };

        // 2. Post Serious Concern (To Admin only)
        window.postSerious = async () => {
            const msg = document.getElementById('message').value;
            if(!msg) return;
            await addDoc(collection(db, "serious_concerns"), {
                text: msg,
                from: document.getElementById('fromCollege').value || "Unknown",
                to: document.getElementById('toWhom').value || "USC",
                status: "pending",
                createdAt: serverTimestamp()
            });
            document.getElementById('message').value = "";
            alert("Concern submitted privately to Admin. Thank you for speaking up!");
        };

        // 3. Listen to PUBLIC WALL only
        const q = query(collection(db, "public_wall"), orderBy("createdAt", "desc"), limit(10));
        onSnapshot(q, (snaps) => {
            const wall = document.getElementById('wall');
            wall.innerHTML = "";
            snaps.forEach(d => {
                const colors = ['bg-yellow-100','bg-blue-100','bg-pink-100','bg-green-100'];
                wall.innerHTML += `<div class="${colors[Math.floor(Math.random()*4)]} p-5 rounded-2xl shadow-sm note animate__animated animate__fadeIn">
                    <p class="text-gray-800 font-medium mb-3">"${d.data().text}"</p>
                    <p class="text-[10px] text-right font-black uppercase text-gray-500">— ${d.data().from}</p>
                </div>`;
            });
        });
    </script>
</body>
</html>
