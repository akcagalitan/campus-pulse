<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Pulse | Wall & Pro Games</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&display=swap');
        body { font-family: 'Space Grotesk', sans-serif; background-color: #0f172a; color: white; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
        .neon-text { text-shadow: 0 0 10px rgba(99, 102, 241, 0.8); }
        #gameHub { display: none; position: fixed; inset: 0; background: rgba(15, 23, 42, 0.98); z-index: 100; overflow-y: auto; }
        .wall-card { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .wall-card:hover { transform: scale(1.05) rotate(2deg); z-index: 10; }
    </style>
</head>
<body class="pb-20">

    <div id="gameHub" class="p-6">
        <div class="max-w-4xl mx-auto">
            <div class="flex justify-between items-center mb-10">
                <h2 class="text-4xl font-black neon-text">ARCADE CENTER 🕹️</h2>
                <button onclick="toggleGame()" class="bg-red-500/20 text-red-500 px-6 py-2 rounded-full font-bold hover:bg-red-500 hover:text-white transition">Exit</button>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                <div class="glass p-8 rounded-[2rem]">
                    <h3 class="text-indigo-400 font-bold mb-4 uppercase tracking-widest">Speed Typer</h3>
                    <p id="targetText" class="text-xl mb-4 text-slate-400 italic">The quick brown fox jumps over the lazy dog.</p>
                    <input type="text" id="typeInput" oninput="checkTyping()" placeholder="Start typing..." class="w-full p-4 bg-slate-800 rounded-xl outline-none border-2 border-transparent focus:border-indigo-500">
                    <p id="typeResult" class="mt-4 font-bold text-green-400"></p>
                </div>

                <div class="glass p-8 rounded-[2rem] text-center">
                    <h3 class="text-pink-400 font-bold mb-4 uppercase tracking-widest">Memory Match</h3>
                    <div id="memoryBoard" class="grid grid-cols-4 gap-2">
                        </div>
                    <button onclick="initMemory()" class="mt-4 text-xs bg-pink-500/20 text-pink-400 px-4 py-2 rounded-lg">Reset Board</button>
                </div>
            </div>
        </div>
    </div>

    <header class="py-16 text-center">
        <h1 class="text-7xl font-black mb-2 animate__animated animate__pulse animate__infinite">CAMPUS <span class="text-indigo-500">PULSE</span></h1>
        <div class="flex justify-center gap-4 mt-6">
            <button onclick="toggleGame()" class="bg-indigo-600 hover:bg-indigo-500 px-8 py-3 rounded-full font-black tracking-widest shadow-lg shadow-indigo-500/50 transition">PLAY & WIN</button>
        </div>
    </header>

    <section class="max-w-2xl mx-auto px-4 mb-20">
        <div class="glass p-10 rounded-[3rem] shadow-2xl">
            <textarea id="message" placeholder="Spill the tea or report a problem..." class="w-full p-6 bg-white/5 rounded-2xl outline-none focus:ring-4 ring-indigo-500/30 h-32 mb-6 text-xl transition"></textarea>
            
            <div class="grid grid-cols-2 gap-4 mb-8">
                <input type="text" id="fromCollege" placeholder="Your College" class="p-4 bg-white/5 rounded-xl outline-none border border-white/10 focus:border-indigo-500">
                <input type="text" id="toWhom" placeholder="To Whom?" class="p-4 bg-white/5 rounded-xl outline-none border border-white/10 focus:border-indigo-500">
            </div>

            <div class="flex flex-col sm:flex-row gap-4">
                <button onclick="postToWall()" class="flex-1 bg-white text-slate-900 py-5 rounded-2xl font-black text-lg hover:bg-indigo-50 transition transform active:scale-95">POST TO WALL 📢</button>
                <button onclick="postSerious()" class="flex-1 bg-indigo-600 text-white py-5 rounded-2xl font-black text-lg hover:bg-indigo-500 shadow-xl shadow-indigo-500/40 transition transform active:scale-95">SERIOUS CONCERN 📩</button>
            </div>
        </div>
    </section>

    <main id="wall" class="container mx-auto px-8 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-8">
        </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, query, orderBy, limit, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAXlmF92ViWxn0lrQ1o8p3s4UlDHBh7CCg",
            authDomain: "web-app-7f330.firebaseapp.com",
            projectId: "web-app-7f330",
            storageBucket: "web-app-7f330.firebasestorage.app",
            messagingSenderId: "991761230541",
            appId: "1:991761230541:web:4063b0ab78e03a72075784"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // --- TYPING GAME ---
        const phrases = ["The College of Technology is superior.", "Student leaders serve with integrity.", "Innovation starts at ISUFST.", "Coding is the language of the future."];
        window.checkTyping = () => {
            const input = document.getElementById('typeInput').value;
            const target = document.getElementById('targetText').innerText;
            if(input === target) {
                confetti();
                document.getElementById('typeResult').innerText = "GOD SPEED! ⚡";
                setTimeout(() => {
                    document.getElementById('targetText').innerText = phrases[Math.floor(Math.random()*phrases.length)];
                    document.getElementById('typeInput').value = "";
                    document.getElementById('typeResult').innerText = "";
                }, 1500);
            }
        };

        // --- MEMORY GAME ---
        window.initMemory = () => {
            const emojis = ['🔥','🔥','💀','💀','🤡','🤡','🚀','🚀','🍀','🍀','💎','💎'];
            const board = document.getElementById('memoryBoard');
            board.innerHTML = "";
            emojis.sort(() => Math.random() - 0.5).forEach(e => {
                board.innerHTML += `<div onclick="this.innerText='${e}'" class="bg-slate-800 h-16 flex items-center justify-center rounded-lg cursor-pointer hover:bg-slate-700 transition">?</div>`;
            });
        };
        initMemory();

        window.toggleGame = () => {
            const gh = document.getElementById('gameHub');
            gh.style.display = gh.style.display === 'block' ? 'none' : 'block';
        };

        // --- FIREBASE BUTTONS FIX ---
        window.postToWall = async () => {
            const msg = document.getElementById('message').value;
            if(!msg) return;
            try {
                await addDoc(collection(db, "public_wall"), {
                    text: msg,
                    from: document.getElementById('fromCollege').value || "Anon",
                    createdAt: serverTimestamp()
                });
                document.getElementById('message').value = "";
                confetti({ particleCount: 100, origin: { y: 0.8 } });
            } catch(e) { alert(e.message); }
        };

        window.postSerious = async () => {
            const msg = document.getElementById('message').value;
            if(!msg) return;
            try {
                await addDoc(collection(db, "serious_concerns"), {
                    text: msg,
                    from: document.getElementById('fromCollege').value || "Unknown",
                    to: document.getElementById('toWhom').value || "USC",
                    status: "pending",
                    createdAt: serverTimestamp()
                });
                document.getElementById('message').value = "";
                alert("📩 Your concern has been sent to the Student Council Admin.");
            } catch(e) { alert(e.message); }
        };

        const q = query(collection(db, "public_wall"), orderBy("createdAt", "desc"), limit(12));
        onSnapshot(q, (snaps) => {
            const wall = document.getElementById('wall');
            wall.innerHTML = "";
            snaps.forEach(d => {
                wall.innerHTML += `
                    <div class="glass p-6 rounded-2xl wall-card animate__animated animate__zoomIn">
                        <p class="text-indigo-400 text-[10px] font-bold uppercase mb-2">Campus Shout</p>
                        <p class="text-slate-200 font-medium italic">"${d.data().text}"</p>
                        <p class="text-[10px] text-right mt-4 opacity-50">— ${d.data().from}</p>
                    </div>`;
            });
        });
    </script>
</body>
</html>
